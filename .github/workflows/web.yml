name: Website and Mini App
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-web.txt pytest
      # Separate process: legacy tests intentionally replace modules in sys.modules.
      - run: python -m pytest -q tests_web
      - run: python tools/export_web_api.py
      - run: npm ci
        working-directory: web
      - run: npm run api:types
        working-directory: web
      - run: git diff --exit-code -- docs/web-openapi.json web/src/api-schema.d.ts
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm test -- --workers=2
        working-directory: web
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: web-browser-failures
          path: web/test-results/
